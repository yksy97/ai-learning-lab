<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ML Visualizer · GAN・偽札と警察</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='16' r='7' fill='%233987e5'/%3E%3Ccircle cx='21' cy='16' r='7' fill='%23d95926' fill-opacity='.85'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div id="nav"></div>
  </header>

  <main class="guide-layout">
    <section class="panel stage">
      <div class="stage-head">
        <h2>お札の世界 <span class="hint">点の位置 ＝ お札の特徴</span></h2>
        <div class="legend">
          <span><i class="dot real"></i>本物のお札</span>
          <span><i class="dot fake"></i>偽札</span>
          <span class="ramp" id="heatLegend"><i class="bar"></i><em>警察：怪しい</em><em>本物っぽい</em></span>
        </div>
      </div>
      <div class="canvas-wrap square">
        <canvas id="main" aria-label="本物のお札と偽札、警察の判定"></canvas>
        <div id="mainTip" class="tip" hidden></div>
      </div>
      <div class="meters">
        <div class="meter">
          <span class="m-label">修行の回数</span>
          <b id="mStep">0</b>
        </div>
        <div class="meter">
          <span class="m-label">警察の正解率 <em>50% に近いほど見分けられていない</em></span>
          <div class="gauge"><i id="mAccBar"></i><s></s></div>
          <b id="mAcc">–</b>
        </div>
        <div class="meter">
          <span class="m-label">作れているお札の種類</span>
          <div class="kinds" id="mKinds"></div>
          <b id="mKindsText">–</b>
        </div>
      </div>
    </section>

    <aside class="panel story" aria-live="polite">
      <div class="story-top">
        <span id="stepNo" class="step-no"></span>
        <div class="dots" id="dots"></div>
      </div>
      <h2 id="stepTitle" class="story-title"></h2>
      <div id="stepBody" class="story-body"></div>
      <div id="stepQuiz"></div>
      <div id="stepActions" class="story-actions"></div>
      <div id="stepTerm" class="term"></div>
      <div class="story-nav">
        <button id="prev">← 前へ</button>
        <button id="next" class="primary">次へ →</button>
      </div>
    </aside>
  </main>

  <section class="panel explain-wrap">
    <h2>読んだら、自分の言葉で言い直してみる</h2>
    <div id="explain"></div>
  </section>

  <footer class="foot">キー操作：← → でページ移動 ・ Space で自動修行の再生/停止　|　ここでの GAN は「GAN」タブと同じもの（たとえ話で説明しているだけ）</footer>

  <script type="module" src="js/gan-guide-main.js"></script>
</body>
</html>
