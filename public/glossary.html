<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Learning Lab · 用語と記号</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='6' width='20' height='20' rx='3' fill='%233987e5'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top"><div id="nav"></div></header>

  <main class="home">
    <section class="panel hero">
      <h2 class="hero-title">用語は「意味 → たとえ → 記号 → 式」の4点セットで覚える</h2>
      <p>記号から入ると折れます。まず一言の意味、次にこのアプリでのたとえ、そのあとで記号と式の順に見てください。
        アプリの本文中に出てくる用語は、点線の下線が付いていればクリックで同じカードが開きます。</p>
    </section>

    <section class="panel">
      <h2>用語辞典</h2>
      <div class="gl-filters" id="filters"></div>
      <div class="gl-grid" id="terms"></div>
    </section>

    <section class="panel" id="symbols">
      <h2>記号の読み方</h2>
      <p class="note">式が読めないのは、たいてい記号が読めないからです。声に出して読めるようになると、論文の見え方が変わります。</p>
      <table class="sym-table">
        <thead><tr><th>記号</th><th>読み方</th><th>意味</th><th>例</th></tr></thead>
        <tbody id="symRows"></tbody>
      </table>
    </section>
  </main>

  <footer class="foot">用語カードは、各ページの本文中の点線つきの言葉からも開けます</footer>

  <script type="module">
    import { TERMS, SYMBOLS, LAYERS } from './js/glossary.js';
    import { mountHeader, mountGoal, enableGlossary } from './js/common.js';
    mountHeader({ id: 'glossary', mode: 'detail', sub: '用語と記号を、意味・たとえ・記号・式の4点セットで引けます' });
mountGoal('glossary');

    const tagList = ['すべて', '共通', 'GAN', 'VAE', 'Transformer', 'RAG'];
    let filter = 'すべて';
    const esc = (s) => s.replace(/</g, '&lt;');

    function renderTerms() {
      const box = document.getElementById('terms');
      const items = TERMS.filter((t) => filter === 'すべて' || t.tags.includes(filter));
      const byLayer = LAYERS.map((l) => ({ ...l, items: items.filter((t) => t.layer === l.id) })).filter((l) => l.items.length);
      box.innerHTML = byLayer.map((l) => `
        <h3 class="group" style="grid-column:1/-1">${l.label}</h3>
        ${l.items.map((t) => `
          <div class="gl-item" id="${t.id}">
            <h3>${t.ja} <span>${t.en}</span></h3>
            <div class="gl-body">${t.short}</div>
            <dl>
              ${t.story ? `<dt>たとえ</dt><dd class="gl-body">${t.story}</dd>` : ''}
              ${t.symbol ? `<dt>記号</dt><dd class="mono">${esc(t.symbol)}</dd>` : ''}
              ${t.formula ? `<dt>式</dt><dd class="mono">${esc(t.formula)}</dd>` : ''}
              ${t.where ? `<dt>見る</dt><dd><a href="${t.where.href}">${t.where.text} →</a></dd>` : ''}
            </dl>
          </div>`).join('')}`).join('');
      if (location.hash) document.querySelector(location.hash)?.scrollIntoView({ block: 'center' });
    }

    document.getElementById('filters').innerHTML = tagList
      .map((t) => `<button data-t="${t}" aria-pressed="${t === filter}">${t}</button>`).join('');
    document.getElementById('filters').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      filter = b.dataset.t;
      for (const x of document.querySelectorAll('#filters button')) x.setAttribute('aria-pressed', String(x.dataset.t === filter));
      renderTerms();
    });
    document.getElementById('symRows').innerHTML = SYMBOLS
      .map((s) => `<tr><td>${esc(s.sym)}</td><td>${s.read}</td><td>${esc(s.mean)}</td><td>${esc(s.ex)}</td></tr>`).join('');
    renderTerms();
    enableGlossary(['.hero']);
  </script>
</body>
</html>
